<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        .container{
            width:80%;
            margin:50px auto;
            text-align:center;
        }

        h1{
            margin-bottom:60px;
            font-size:18px;
        }

        .edit-form{
            display:flex;
            justify-content:center;
            max-width:500px;
            margin:auto;
        }

        .edit-form input{
            flex:1;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px 0 0 10px;
            font-size:18px;
            outline:none;
        }

        .edit-form button{
            width:150px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:0 10px 10px 0;
            font-size:18px;
            cursor:pointer;
        }

        .edit-form button:hover{
            background:#0b5ed7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Django TODO App - Edit Task</h1>

        <form method="POST" class="edit-form">
            {% csrf_token %}
            <input type="text" name="task" value="{{ task.task }}" required>
            <button type="submit">➕ Update</button>
        </form>

    </div>

</body>
</html>
