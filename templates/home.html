<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Django Todo App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    width:90%;
    margin:20px auto;
}

.title{
    text-align:center;
    font-size:40px;
    font-weight:600;
    margin-bottom:30px;
}

.myday h2{
    font-size:32px;
    margin-bottom:5px;
}

.myday p{
    color:gray;
    font-size:18px;
}

.main-content{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.left-panel{
    flex:2;
}

.right-panel{
    flex:1;
}

.task-list{
    height:500px;
    overflow-y:auto;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
}

.task-card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.task-actions{
    display:flex;
    gap:8px;
}

.task-actions button{
    border:none;
    padding:10px 15px;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

.done{
    background:#198754;
}

.delete{
    background:#dc3545;
}

.edit{
    background:#0d6efd;
}

.completed-box{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

.completed-item{
    border:1px solid #e5e5e5;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

.add-task{
    display:flex;
    margin-top:15px;
}

.add-task input{
    flex:1;
    padding:18px;
    border:1px solid #ddd;
    border-radius:10px 0 0 10px;
    outline:none;
}

.add-task button{
    width:180px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:0 10px 10px 0;
    font-size:18px;
}

@media(max-width:768px){
    .main-content{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="title">Django ToDo App</h1>

    <div class="myday">
        <h2>My Day</h2>
        <p>27th Auguest 2026</p>
    </div>

    <div class="main-content">

        <!-- Pending Tasks -->
        <div class="left-panel">

            <div class="task-list">
                {% for task in tasks %}
                <div class="task-card">
                 <span>{{ task.task }}</span>

                    <div class="task-actions">
                        <button class="done">✓ Mark as Done</button>
                        <button class="delete">🗑</button>
                        <button class="edit">✎</button>
                    </div>
                </div>
                {% endfor %}
            </div>
            <form action="{% url 'addTask' %}" method="POST">
            {% csrf_token %}
            <div class="add-task">
                <input type="text" name='task' placeholder="Add a task">
                <button type="submit">Add</button>
            </div>
        </form>

        </div>

        <!-- Completed Tasks -->
        <div class="right-panel">

            <div class="completed-box">
                <h3>Completed Tasks</h3>

                <div class="completed-item">
                    This is the completed task.
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
